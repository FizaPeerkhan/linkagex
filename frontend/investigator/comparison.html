<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Similarity Explanation | LinkageX</title>
  <link rel="stylesheet" href="../css/style.css">

  <style>
    /* =========================================
       LINKAGEX — SIMILARITY EXPLANATION
       Page-scoped styling
    ========================================= */

    #content {
      --sx-void: #05070d;
      --sx-panel: #0a0f18;
      --sx-panel2: #0d1420;
      --sx-line: rgba(148, 197, 224, 0.14);
      --sx-line-strong: rgba(148, 197, 224, 0.27);
      --sx-ink: #e9f1f8;
      --sx-dim: #8fa0b6;
      --sx-faint: #5b6a80;
      --sx-cyan: #54d9ff;
      --sx-amber: #ffb454;
      --sx-green: #5ee69b;
      --sx-violet: #b98bff;

      color: var(--sx-ink);
      min-width: 0;
    }

    #content * {
      box-sizing: border-box;
    }

    #content .sx-page {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-bottom: 32px;
      min-width: 0;
    }

    /* Page heading */

    #content .sx-page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding: 5px 0 19px;
      border-bottom: 1px solid var(--sx-line);
    }

    #content .sx-heading-main {
      min-width: 0;
      flex: 1;
    }

    #content .sx-eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--sx-cyan);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    #content .sx-eyebrow::before {
      content: "";
      width: 18px;
      height: 1px;
      background: var(--sx-cyan);
    }

    #content .sx-page-head h1 {
      margin: 0;
      color: var(--sx-ink);
      font-size: clamp(24px, 3vw, 32px);
      line-height: 1.2;
      letter-spacing: -0.045em;
      font-weight: 650;
    }

    #content .sx-subtitle {
      max-width: 690px;
      margin: 10px 0 0;
      color: var(--sx-dim);
      font-size: 13px;
      line-height: 1.8;
    }

    #content .sx-header-actions {
      flex-shrink: 0;
      padding-top: 17px;
    }

    #content .sx-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      padding: 9px 13px;
      border: 1px solid var(--sx-line-strong);
      border-radius: 8px;
      background: rgba(13, 20, 32, 0.9);
      color: var(--sx-ink);
      font-family: inherit;
      font-size: 12px;
      font-weight: 550;
      line-height: 1.4;
      text-decoration: none;
      white-space: normal;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease,
        transform 0.18s ease;
    }

    #content .sx-btn:hover {
      border-color: rgba(84, 217, 255, 0.48);
      background: rgba(84, 217, 255, 0.07);
      transform: translateY(-1px);
    }

    #content .sx-btn-primary {
      border-color: rgba(84, 217, 255, 0.32);
      background: rgba(84, 217, 255, 0.09);
      color: var(--sx-cyan);
    }

    #content .sx-btn-primary:hover {
      background: rgba(84, 217, 255, 0.15);
    }

    #content .sx-btn-warning {
      border-color: rgba(255, 180, 84, 0.25);
      color: var(--sx-amber);
    }

    #content .sx-btn-warning:hover {
      border-color: rgba(255, 180, 84, 0.5);
      background: rgba(255, 180, 84, 0.07);
    }

    /* Context strip */

    #content .sx-context-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 13px 16px;
      border: 1px solid var(--sx-line);
      border-radius: 10px;
      background:
        linear-gradient(110deg, rgba(84, 217, 255, 0.045), transparent 60%),
        var(--sx-panel);
    }

    #content .sx-pair {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      min-width: 0;
    }

    #content .sx-pair-label {
      color: var(--sx-dim);
      font-size: 11px;
    }

    #content .sx-case-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 9px;
      border: 1px solid var(--sx-line-strong);
      border-radius: 6px;
      background: var(--sx-panel2);
      color: var(--sx-ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
    }

    #content .sx-case-chip-current::before,
    #content .sx-case-chip-compared::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    #content .sx-case-chip-current::before {
      background: var(--sx-cyan);
      box-shadow: 0 0 8px rgba(84, 217, 255, 0.3);
    }

    #content .sx-case-chip-compared::before {
      background: var(--sx-violet);
      box-shadow: 0 0 8px rgba(185, 139, 255, 0.3);
    }

    #content .sx-pair-vs {
      color: var(--sx-faint);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
    }

    #content .sx-context-note {
      color: var(--sx-dim);
      font-size: 11px;
      line-height: 1.6;
    }

    /* Main layout */

    #content .sx-main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      gap: 16px;
      align-items: stretch;
    }

    #content .sx-panel {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--sx-line);
      border-radius: 13px;
      background:
        radial-gradient(ellipse at top left, rgba(84, 217, 255, 0.023), transparent 50%),
        var(--sx-panel);
    }

    #content .sx-panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 17px 18px;
      border-bottom: 1px solid var(--sx-line);
    }

    #content .sx-panel-title {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
    }

    #content .sx-panel-icon {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border: 1px solid var(--sx-line);
      border-radius: 8px;
      background: var(--sx-panel2);
      color: var(--sx-cyan);
      font-size: 15px;
    }

    #content .sx-panel-title h2 {
      margin: 1px 0 5px;
      color: var(--sx-ink);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.45;
    }

    #content .sx-panel-title p {
      margin: 0;
      color: var(--sx-dim);
      font-size: 11px;
      line-height: 1.65;
    }

    #content .sx-panel-body {
      padding: 18px;
      min-width: 0;
    }

    #content .sx-small-tag {
      flex-shrink: 0;
      padding: 5px 8px;
      border: 1px solid var(--sx-line);
      border-radius: 6px;
      color: var(--sx-dim);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      white-space: nowrap;
    }

    /* Signal breakdown */

    #content .sx-breakdown {
      display: flex;
      flex-direction: column;
      gap: 19px;
    }

    #content .sx-signal-row {
      display: grid;
      grid-template-columns: minmax(100px, 0.85fr) minmax(70px, 1.3fr) 42px;
      gap: 11px;
      align-items: center;
    }

    #content .sx-signal-name {
      color: #c5d2e0;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #content .sx-track {
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(148, 197, 224, 0.1);
    }

    #content .sx-track-fill {
      height: 100%;
      min-width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #219fce, var(--sx-cyan));
      box-shadow: 0 0 10px rgba(84, 217, 255, 0.16);
      transition: width 0.4s ease;
    }

    #content .sx-signal-percent {
      color: var(--sx-cyan);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      text-align: right;
      font-weight: 500;
    }

    #content .sx-empty {
      padding: 15px;
      border: 1px dashed var(--sx-line-strong);
      border-radius: 8px;
      color: var(--sx-dim);
      font-size: 12px;
      line-height: 1.7;
    }

    /* Overall score */

    #content .sx-overall {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 23px;
      padding: 18px;
      border: 1px solid rgba(84, 217, 255, 0.17);
      border-radius: 10px;
      background:
        radial-gradient(circle at 12% 50%, rgba(84, 217, 255, 0.075), transparent 50%),
        rgba(13, 20, 32, 0.8);
    }

    #content .sx-score-ring {
      display: grid;
      place-items: center;
      position: relative;
      flex-shrink: 0;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: conic-gradient(
        var(--sx-cyan) var(--sx-score, 0%),
        rgba(148, 197, 224, 0.1) var(--sx-score, 0%)
      );
    }

    #content .sx-score-ring::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(148, 197, 224, 0.09);
      border-radius: 50%;
      background: #0b111b;
    }

    #content .sx-score-ring span {
      position: relative;
      z-index: 1;
      color: var(--sx-ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 19px;
      font-weight: 500;
    }

    #content .sx-overall-info {
      min-width: 0;
    }

    #content .sx-overall-label {
      margin: 0;
      color: var(--sx-ink);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
    }

    #content .sx-overall-description {
      margin: 6px 0 0;
      color: var(--sx-dim);
      font-size: 11px;
      line-height: 1.75;
    }

    #content .sx-score-caption {
      display: inline-block;
      margin-top: 9px;
      color: var(--sx-cyan);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
    }

    /* Signals and differences */

    #content .sx-subsection + .sx-subsection {
      margin-top: 23px;
      padding-top: 21px;
      border-top: 1px solid var(--sx-line);
    }

    #content .sx-subsection-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 13px;
      color: var(--sx-ink);
      font-size: 12px;
      font-weight: 600;
    }

    #content .sx-heading-dot {
      width: 6px;
      height: 6px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--sx-green);
    }

    #content .sx-heading-dot-warning {
      background: var(--sx-amber);
    }

    #content .sx-heading-count {
      margin-left: auto;
      color: var(--sx-faint);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      font-weight: 400;
    }

    #content .sx-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    #content .sx-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      padding: 7px 9px;
      border: 1px solid rgba(94, 230, 155, 0.17);
      border-radius: 7px;
      background: rgba(94, 230, 155, 0.045);
      color: #b9e9ce;
      font-size: 11px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #content .sx-tag::before {
      content: "+";
      color: var(--sx-green);
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
    }

    #content .sx-difference-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    #content .sx-difference-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid rgba(255, 180, 84, 0.13);
      border-radius: 8px;
      background: rgba(255, 180, 84, 0.025);
      color: #c5d1df;
      font-size: 11px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    #content .sx-difference-icon {
      flex-shrink: 0;
      margin-top: 1px;
      color: var(--sx-amber);
    }

    /* Comparison table */

    #content .sx-comparison-panel {
      min-width: 0;
    }

    #content .sx-table-wrap {
      width: 100%;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: #243548 transparent;
    }

    #content .sx-table {
      width: 100%;
      min-width: 530px;
      border-collapse: collapse;
      text-align: left;
    }

    #content .sx-table thead th {
      padding: 12px 16px;
      border-bottom: 1px solid var(--sx-line);
      background: rgba(13, 20, 32, 0.8);
      color: var(--sx-faint);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    #content .sx-table tbody td {
      padding: 13px 16px;
      border-bottom: 1px solid rgba(148, 197, 224, 0.08);
      color: #bdcada;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #content .sx-table tbody tr:last-child td {
      border-bottom: none;
    }

    #content .sx-table tbody tr {
      transition: background 0.15s ease;
    }

    #content .sx-table tbody tr:hover {
      background: rgba(84, 217, 255, 0.025);
    }

    #content .sx-table tbody td:first-child {
      color: var(--sx-dim);
      font-weight: 500;
    }

    #content .sx-table .sx-current-value {
      color: var(--sx-cyan);
    }

    #content .sx-table .sx-compared-value {
      color: #d7c4ff;
    }

    #content .sx-table .sx-value-match {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #content .sx-match-mark {
      color: var(--sx-green);
      font-size: 10px;
    }

    #content .sx-difference-mark {
      color: var(--sx-amber);
      font-size: 10px;
    }

    /* Table footnote */

    #content .sx-table-note {
      padding: 12px 16px;
      border-top: 1px solid var(--sx-line);
      color: var(--sx-dim);
      font-size: 11px;
      line-height: 1.7;
    }

    /* Interpretation guidance */

    #content .sx-guardrail {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 15px 17px;
      border: 1px solid rgba(84, 217, 255, 0.17);
      border-radius: 10px;
      background: rgba(84, 217, 255, 0.035);
    }

    #content .sx-guardrail-icon {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border: 1px solid rgba(84, 217, 255, 0.2);
      border-radius: 8px;
      background: rgba(84, 217, 255, 0.06);
      color: var(--sx-cyan);
      font-size: 14px;
    }

    #content .sx-guardrail h3 {
      margin: 1px 0 5px;
      color: var(--sx-ink);
      font-size: 12px;
      font-weight: 600;
    }

    #content .sx-guardrail p {
      margin: 0;
      color: var(--sx-dim);
      font-size: 11px;
      line-height: 1.8;
    }

    #content .sx-guardrail strong {
      color: #dce7f3;
      font-weight: 500;
    }

    /* Action area */

    #content .sx-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 2px;
    }

    #content .sx-action-copy {
      max-width: 410px;
      color: var(--sx-dim);
      font-size: 11px;
      line-height: 1.7;
    }

    #content .sx-action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    /* Responsive */

    @media (max-width: 1000px) {
      #content .sx-main-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 600px) {
      #content .sx-page {
        gap: 13px;
      }

      #content .sx-page-head {
        flex-direction: column;
        gap: 8px;
        padding-bottom: 15px;
      }

      #content .sx-page-head h1 {
        font-size: 26px;
      }

      #content .sx-header-actions {
        padding-top: 2px;
      }

      #content .sx-context-strip {
        align-items: flex-start;
        flex-direction: column;
      }

      #content .sx-panel-head {
        padding: 14px;
      }

      #content .sx-panel-body {
        padding: 14px;
      }

      #content .sx-signal-row {
        grid-template-columns: minmax(85px, 0.9fr) minmax(45px, 1fr) 36px;
        gap: 8px;
      }

      #content .sx-signal-name {
        font-size: 11px;
      }

      #content .sx-overall {
        gap: 14px;
        padding: 14px;
      }

      #content .sx-score-ring {
        width: 76px;
        height: 76px;
      }

      #content .sx-score-ring span {
        font-size: 17px;
      }

      #content .sx-action-buttons {
        width: 100%;
      }

      #content .sx-action-buttons .sx-btn {
        flex: 1 1 180px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #content *,
      #content *::before,
      #content *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

<body>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>

  <script>
    "use strict";

    const content = shell("investigator", "Potential Linkages");

    const params = new URLSearchParams(location.search);
    const caseId = params.get("case") || "CC034";

    const r = getSimilarityBreakdown(caseId);

    /* -----------------------------------------
       Safe formatting helpers
    ----------------------------------------- */

    function sxEscape(value) {
      if (typeof esc === "function") {
        return esc(String(value ?? ""));
      }

      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function sxPercent(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return 0;

      return Math.round(Math.max(0, Math.min(1, number)) * 100);
    }

    function sxDisplay(value) {
      if (
        value === null ||
        value === undefined ||
        String(value).trim() === "" ||
        String(value).toLowerCase().trim() === "nan"
      ) {
        return "Not recorded";
      }

      return String(value);
    }

    function sxSignalLabel(key) {
      if (key === "mo") return "MO similarity";

      return String(key)
        .replace(/([A-Z])/g, " $1")
        .replace(/^./, first => first.toUpperCase());
    }

    function sxRenderSignals(signals) {
      const entries = Object.entries(signals || {});

      if (!entries.length) {
        return `
          <div class="sx-empty">
            No individual similarity signals are available for this case.
          </div>
        `;
      }

      return entries.map(([key, value]) => {
        const percentage = sxPercent(value);

        return `
          <div class="sx-signal-row">
            <div class="sx-signal-name">${sxEscape(sxSignalLabel(key))}</div>

            <div
              class="sx-track"
              role="progressbar"
              aria-label="${sxEscape(sxSignalLabel(key))}"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="${percentage}"
            >
              <div
                class="sx-track-fill"
                style="width:${percentage}%"
              ></div>
            </div>

            <div class="sx-signal-percent">${percentage}%</div>
          </div>
        `;
      }).join("");
    }

    function sxRenderCommonSignals(signals) {
      if (!Array.isArray(signals) || signals.length === 0) {
        return `
          <div class="sx-empty">
            No common signals were returned for this comparison.
          </div>
        `;
      }

      return `
        <div class="sx-tags">
          ${signals.map(signal => `
            <span class="sx-tag">${sxEscape(signal)}</span>
          `).join("")}
        </div>
      `;
    }

    function sxRenderDifferences(differences) {
      if (!Array.isArray(differences) || differences.length === 0) {
        return `
          <div class="sx-empty">
            No differences were returned by the current breakdown.
            This does not necessarily mean the cases are identical.
          </div>
        `;
      }

      return `
        <div class="sx-difference-list">
          ${differences.map(difference => `
            <div class="sx-difference-item">
              <span class="sx-difference-icon" aria-hidden="true">△</span>
              <span>${sxEscape(difference)}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    /* -----------------------------------------
       Incident comparison
       Preserves the existing demonstration data
    ----------------------------------------- */

    const comparisonRows = [
      ["Channel", "WhatsApp", "WhatsApp"],
      ["Crime Type", "Loan Scam", "Loan Scam"],
      ["MO", "Fake loan offer", "Fake loan offer"],
      ["Victim Action", "Paid fee", "Transferred money"],
      ["Amount", "₹15,000", "₹18,000"],
      ["Region", "Mumbai", "Pune"]
    ];

    function sxRenderComparison(rows) {
      return rows.map(([label, current, compared]) => {
        const match = String(current).trim().toLowerCase() ===
          String(compared).trim().toLowerCase();

        return `
          <tr>
            <td>${sxEscape(label)}</td>

            <td class="sx-current-value">
              ${match
                ? `<span class="sx-value-match"><span class="sx-match-mark">●</span>${sxEscape(current)}</span>`
                : sxEscape(current)}
            </td>

            <td class="sx-compared-value">
              ${match
                ? `<span class="sx-value-match"><span class="sx-match-mark">●</span>${sxEscape(compared)}</span>`
                : `<span class="sx-value-match"><span class="sx-difference-mark">△</span>${sxEscape(compared)}</span>`}
            </td>
          </tr>

      }).join("");
