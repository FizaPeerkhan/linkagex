<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Upload Report</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>

  <script>
    const c=shell("investigator","Upload Report");c.innerHTML=pageHead("Upload Existing Report","Convert an existing report into the same standardized incident representation used for citizen complaints.");

    c.innerHTML+=`<div class="grid grid-2"><div class="card"><div class="upload" id="drop"><div class="upload-icon">↑</div><h3>Drag & drop report here</h3><p>or</p><button class="btn btn-primary" id="browse">Browse Files</button><input id="file" type="file" accept=".pdf,.txt" hidden><p>PDF, TXT • Prototype limit: 10 MB</p></div><div class="divider"></div><div class="callout-title">Or enter report manually</div><textarea id="manual" placeholder="Paste report text here…"></textarea><button class="btn btn-primary" style="margin-top:12px" id="processManual">Process Report →</button></div><div class="card"><div class="alert alert-info">Prototype behavior: file selection and processing are simulated. The frontend does <strong>not</strong> claim to extract real PDF contents without a backend.</div><div class="section"><h3>Processing pipeline</h3><div class="list"><div class="list-item">1. Reading report</div><div class="list-item">2. Extracting incident details</div><div class="list-item">3. Structuring incident</div><div class="list-item">4. Searching related incidents</div></div></div></div></div>`;

    document.getElementById("browse").onclick=()=>document.getElementById("file").click();document.getElementById("file").onchange=e=>process(e.target.files[0]?.name||"Selected report");document.getElementById("processManual").onclick=()=>process("Manual report");

    const drop=document.getElementById("drop");drop.ondragover=e=>{e.preventDefault();drop.classList.add("drag")};drop.ondragleave=()=>drop.classList.remove("drag");drop.ondrop=e=>{e.preventDefault();drop.classList.remove("drag");process(e.dataTransfer.files[0]?.name||"Dropped report")};

    function process(name){c.innerHTML=`<div class="loading-screen"><div><div class="spinner"></div><div class="loading-copy"><h3>Processing Report</h3><p>${esc(name)} · Reading · Structuring · Searching related incidents</p></div></div></div>`;setTimeout(()=>location.href="case-details.html?case=CC001",1200)}
  </script>

</body>
</html>
