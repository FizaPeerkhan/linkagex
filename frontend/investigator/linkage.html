<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Case Linkage | LinkageX</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
/* =====================================================
   LINKAGEX — CASE LINKAGE UI
   Shared sidebar and header come from app.js
===================================================== */

#content {
    min-width: 0;
    color: #e9f1f8;
}

#content .page-head {
    margin-bottom: 28px;
}

#content .page-head h1 {
    color: #e9f1f8;
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(25px, 2.4vw, 34px);
    line-height: 1.2;
}

#content .page-head p {
    color: #8fa0b6;
    line-height: 1.7;
    max-width: 760px;
}

/* Main cards */

#content > .card {
    position: relative;
    min-width: 0;
    margin: 0 0 22px;
    padding: 25px;
    border: 1px solid rgba(148,197,224,.20);
    border-radius: 0;
    background: linear-gradient(145deg, #0d1420, #080d16);
    color: #e9f1f8;
    box-shadow: 0 16px 45px rgba(0,0,0,.16);
}

#content > .card::before,
#content > .card::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    pointer-events: none;
}

#content > .card::before {
    top: -1px;
    left: -1px;
    border-top: 2px solid #54d9ff;
    border-left: 2px solid #54d9ff;
}

#content > .card::after {
    bottom: -1px;
    right: -1px;
    border-bottom: 2px solid #54d9ff;
    border-right: 2px solid #54d9ff;
}

/* Section headings */

#content .section-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

#content .section-head h3 {
    margin: 0 0 7px;
    color: #e9f1f8;
    font: 600 19px 'Space Grotesk', sans-serif;
}

#content .card-sub {
    color: #8fa0b6;
    font-size: 13px;
    line-height: 1.7;
}

/* Complaint textarea */

#content .linkage-input {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 210px;
    margin: 0;
    padding: 15px 16px;
    resize: vertical;
    border: 1px solid rgba(148,197,224,.28);
    border-radius: 0;
    outline: none;
    background: #060910;
    color: #e9f1f8;
    font: 400 14px/1.75 'IBM Plex Sans', sans-serif;
    box-shadow: none;
    transition: border-color .2s, box-shadow .2s;
}

#content .linkage-input::placeholder {
    color: #5b6a80;
    opacity: 1;
}

#content .linkage-input:focus {
    border-color: #54d9ff;
    box-shadow: 0 0 0 3px rgba(84,217,255,.09);
}

/* Actions */

#content .analysis-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
}

#content .analysis-actions .btn {
    min-height: 42px;
    padding: 10px 18px;
    border-radius: 0;
    font: 500 13px 'IBM Plex Sans', sans-serif;
}

#content .analysis-actions .btn-primary,
#content #linkage-next .btn-primary {
    border: 0;
    background: #54d9ff;
    color: #05070d;
    font-weight: 600;
    clip-path: polygon(
        9px 0,
        100% 0,
        100% calc(100% - 9px),
        calc(100% - 9px) 100%,
        0 100%,
        0 9px
    );
}

#content .analysis-actions .btn-primary:hover,
#content #linkage-next .btn-primary:hover {
    filter: brightness(1.12);
    transform: translateY(-1px);
}

#content .analysis-actions .btn-secondary,
#content .page-head .btn-secondary {
    border: 1px solid rgba(148,197,224,.28);
    border-radius: 0;
    background: transparent;
    color: #e9f1f8;
}

#content .analysis-actions .btn-secondary:hover,
#content .page-head .btn-secondary:hover {
    border-color: #54d9ff;
    background: rgba(84,217,255,.10);
    color: #e9f1f8;
}

#content .analysis-actions .btn:disabled {
    opacity: .55;
    cursor: wait;
}

/* Loading, error and success messages */

#content .status-message {
    margin-top: 16px;
}

#content .status-message .alert {
    padding: 15px 17px;
    border: 1px solid rgba(148,197,224,.20);
    border-left: 3px solid #54d9ff;
    border-radius: 0;
    background: rgba(84,217,255,.055);
    color: #8fa0b6;
    font-size: 13px;
    line-height: 1.7;
}

#content .status-message .alert strong {
    color: #e9f1f8;
}

#content .status-message .alert-danger {
    border-left-color: #ff7a7a;
    background: rgba(255,122,122,.055);
}

#content .status-message .alert-success {
    border-left-color: #5ee69b;
    background: rgba(94,230,155,.055);
}

/* Structured incident grid */

#content .incident-grid-linkage {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin-top: 18px;
}

#content .incident-item {
    min-width: 0;
    padding: 14px;
    border: 1px solid rgba(148,197,224,.15);
    border-radius: 0;
    background: rgba(5,7,13,.36);
    overflow-wrap: anywhere;
}

#content .incident-item .field-label {
    margin-bottom: 7px;
    color: #5b6a80;
    font: 500 10px 'IBM Plex Mono', monospace;
    letter-spacing: .07em;
    text-transform: uppercase;
}

#content .incident-item .field-value {
    color: #e9f1f8;
    font: 400 13px/1.6 'IBM Plex Sans', sans-serif;
    overflow-wrap: anywhere;
    word-break: normal;
}

/* NLP Structured tag */

#content .tag {
    display: inline-flex;
    align-items: center;
    padding: 5px 10px;
    border: 1px solid rgba(84,217,255,.30);
    border-radius: 0;
    background: rgba(84,217,255,.08);
    color: #54d9ff;
    font: 500 10px 'IBM Plex Mono', monospace;
    letter-spacing: .04em;
}

/* Potentially related cases panel */

#content .linkage-next {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 20px;
    padding: 18px;
    border: 1px solid rgba(84,217,255,.22);
    border-left: 3px solid #54d9ff;
    border-radius: 0;
    background: rgba(84,217,255,.045);
}

#content .linkage-next-text {
    min-width: 0;
    flex: 1 1 250px;
}

#content .linkage-next-text h4 {
    margin: 0 0 5px;
    color: #e9f1f8;
    font: 600 15px 'Space Grotesk', sans-serif;
}

#content .linkage-next-text p {
    margin: 0;
    color: #8fa0b6;
    font-size: 12px;
    line-height: 1.65;
}

#content #linkage-next .btn-primary {
    min-height: 42px;
    padding: 10px 18px;
    white-space: nowrap;
    text-decoration: none;
}

/* Responsive */

@media (max-width: 900px) {
    #content .incident-grid-linkage {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 600px) {
    #content > .card {
        padding: 18px;
    }

    #content .incident-grid-linkage {
        grid-template-columns: minmax(0, 1fr);
    }

    #content .analysis-actions {
        flex-direction: column;
        align-items: stretch;
    }

    #content .analysis-actions .btn {
        width: 100%;
    }

    #content .linkage-next {
        align-items: stretch;
        flex-direction: column;
    }

    #content #linkage-next .btn-primary {
        justify-content: center;
        width: 100%;
        white-space: normal;
    }
}
</style>
</head>

<body>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>

<script>

    /* =========================================================
       PAGE SHELL
    ========================================================= */

    const c = shell(
        "investigator",
        "Potential Linkages"
    );


    c.innerHTML = pageHead(
        "Case Linkage",
        "Analyze an incident and identify potentially related historical cases.",
        `<a class="btn btn-secondary" href="cases.html">
            ← Case Repository
        </a>`
    );


    /* =========================================================
       COMPLAINT INPUT
    ========================================================= */

    c.innerHTML += `

        <div class="card">

            <div class="section-head">

                <div>

                    <h3>
                        Analyze New Complaint
                    </h3>

                    <p class="card-sub">
                        Enter a cybercrime complaint to structure
                        the incident and compare it against historical cases.
                    </p>

                </div>

            </div>


            <textarea
                id="complaintText"
                class="linkage-input"
                placeholder="Paste or enter the complaint text here…"
            ></textarea>


            <div class="analysis-actions">

                <button
                    id="linkageBtn"
                    class="btn btn-primary"
                    onclick="runLinkage()"
                >
                    Find Related Cases
                </button>


                <button
                    class="btn btn-secondary"
                    onclick="clearPage()"
                >
                    Clear
                </button>

            </div>


            <div
                id="loading"
                class="status-message"
                style="display:none;"
            >

                <div class="alert alert-info">

                    <strong>
                        Analyzing complaint…
                    </strong>

                    <br>

                    Structuring the incident and searching historical cases.

                </div>

            </div>


            <div
                id="error"
                class="status-message"
                style="display:none;"
            ></div>


            <div
                id="success"
                class="status-message"
                style="display:none;"
            ></div>

        </div>

    `;


    /* =========================================================
       STRUCTURED INCIDENT
    ========================================================= */

    c.innerHTML += `

        <div
            id="incident-section"
            class="card"
            style="display:none;"
        >

            <div class="section-head">

                <div>

                    <h3>
                        Structured Incident
                    </h3>

                    <p class="card-sub">
                        Information extracted from the complaint
                        by the LinkageX NLP pipeline.
                    </p>

                </div>


                <span class="tag">
                    NLP Structured
                </span>

            </div>


            <div
                id="incident-grid"
                class="incident-grid-linkage"
            ></div>


            <div
                id="linkage-next"
                class="linkage-next"
                style="display:none;"
            >

                <div class="linkage-next-text">

                    <h4>
                        Potentially Related Cases Found
                    </h4>

                    <p id="linkage-count">
                        Review the historical cases surfaced
                        by the correlation engine.
                    </p>

                </div>


                <a
                    class="btn btn-primary"
                    href="related-cases.html"
                >
                    View Related Cases →
                </a>

            </div>

        </div>

    `;


    /* =========================================================
       CONFIGURATION
    ========================================================= */

    const API_BASE =
        "http://127.0.0.1:5000";


    const complaintText =
        document.getElementById(
            "complaintText"
        );


    const linkageBtn =
        document.getElementById(
            "linkageBtn"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const errorBox =
        document.getElementById(
            "error"
        );


    const successBox =
        document.getElementById(
            "success"
        );


    const incidentSection =
        document.getElementById(
            "incident-section"
        );


    const incidentGrid =
        document.getElementById(
            "incident-grid"
        );


    const linkageNext =
        document.getElementById(
            "linkage-next"
        );


    const linkageCount =
        document.getElementById(
            "linkage-count"
        );


    /* =========================================================
       RUN LINKAGE
    ========================================================= */

    async function runLinkage() {

        const text =
            complaintText.value.trim();


        if (!text) {

            showError(
                "Please enter a complaint before searching."
            );

            return;
        }


        hideMessages();

        // Do not let a failed/new search leave old matches visible.
        sessionStorage.removeItem("linkageX_results");
        sessionStorage.removeItem("linkageX_incident");
        sessionStorage.removeItem("linkageX_original_complaint");

        loading.style.display =
            "block";


        linkageBtn.disabled =
            true;


        incidentSection.style.display =
            "none";


        linkageNext.style.display =
            "none";


        try {

            /* -------------------------------------------------
               STEP 1 — NLP ANALYSIS
            ------------------------------------------------- */

            const analyzeResponse =
                await fetch(
                    `${API_BASE}/api/analyze`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            complaint_text: text
                        })
                    }
                );


            const analyzeData =
                await analyzeResponse.json();


            if (!analyzeResponse.ok) {

                throw new Error(
                    analyzeData.message ||
                    "Complaint analysis failed."
                );

            }


            const incident =
                analyzeData.data.incident;


            /* -------------------------------------------------
               STEP 2 — DISPLAY STRUCTURED INCIDENT
            ------------------------------------------------- */

            displayIncident(
                incident
            );


            /* -------------------------------------------------
               STEP 3 — LINKAGE SEARCH
            ------------------------------------------------- */

            const linkageResponse =
                await fetch(
                    `${API_BASE}/api/linkage`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            incident: {
                                ...incident,
                                complaint_text: incident.complaint_text || text
                            },
                            complaint_text: text
                        })
                    }
                );


            const linkageData =
                await linkageResponse.json();


            if (!linkageResponse.ok) {

                throw new Error(
                    linkageData.message ||
                    "Case linkage failed."
                );

            }


            const results =
                linkageData.results || [];


            /* -------------------------------------------------
               STEP 4 — SAVE RESULTS
            ------------------------------------------------- */

            sessionStorage.setItem(
                "linkageX_incident",
                JSON.stringify({ ...incident, complaint_text: text })
            );

            sessionStorage.setItem(
                "linkageX_original_complaint",
                text
            );

            sessionStorage.setItem(
                "linkageX_results",
                JSON.stringify(results)
            );


            /* -------------------------------------------------
               STEP 5 — SHOW NEXT ACTION
            ------------------------------------------------- */

            linkageNext.style.display =
                "flex";


            linkageCount.textContent =
                results.length
                    ? `${results.length} historical case(s) met the minimum similarity threshold.`
                    : "No historical case met the minimum similarity threshold. The incident can be retained for future comparison.";


            showSuccess(
                results.length
                    ? "Analysis complete. Related cases are ready for review."
                    : "Analysis complete. No significant relationship was identified."
            );

        }


        catch (error) {

            console.error(
                "Linkage error:",
                error
            );


            showError(
                error.message ||
                "Unable to connect to LinkageX backend."
            );

        }


        finally {

            loading.style.display =
                "none";


            linkageBtn.disabled =
                false;

        }

    }


    /* =========================================================
       DISPLAY STRUCTURED INCIDENT
    ========================================================= */

    function displayIncident(
        incident
    ) {

        incidentSection.style.display =
            "block";


        const fields = [

            [
                "Crime Category",
                incident.crime_category
            ],

            [
                "Crime Subcategory",
                incident.crime_subcategory
            ],

            [
                "Modus Operandi",
                formatValue(
                    incident.modus_operandi
                )
            ],

            [
                "Deception",
                formatValue(
                    incident.deception
                )
            ],

            [
                "Victim Action",
                formatValue(
                    incident.victim_action
                )
            ],

            [
                "Attacker Action",
                formatValue(
                    incident.attacker_action
                )
            ],

            [
                "Outcome",
                formatValue(
                    incident.outcome
                )
            ],

            [
                "Channels",
                formatValue(
                    incident.channels
                )
            ],

            [
                "Payment Method",
                formatValue(
                    incident.payment_method
                )
            ],

            [
                "Amount",
                formatAmount(
                    incident.amounts
                )
            ],

            [
                "Organizations",
                formatValue(
                    incident.organizations
                )
            ],

            [
                "Locations",
                formatValue(
                    incident.locations
                )
            ]

        ];


        incidentGrid.innerHTML =
            fields
                .map(
                    ([label, value]) => `

                        <div class="incident-item">

                            <div class="field-label">
                                ${escapeHtml(label)}
                            </div>

                            <div class="field-value">
                                ${escapeHtml(
                                    value ||
                                    "Not identified"
                                )}
                            </div>

                        </div>

                    `
                )
                .join("");

    }


    /* =========================================================
       FORMAT VALUES
    ========================================================= */

    function formatValue(
        value
    ) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {

            return "";

        }


        if (Array.isArray(value)) {

            return value.length
                ? value.join(", ")
                : "";

        }


        return String(value);

    }


    function formatAmount(
        value
    ) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {

            return "";

        }


        if (Array.isArray(value)) {

            if (!value.length) {
                return "";
            }


            return value
                .map(
                    amount =>
                        `₹${Number(
                            amount
                        ).toLocaleString(
                            "en-IN"
                        )}`
                )
                .join(", ");

        }


        const numeric =
            Number(value);


        if (!Number.isNaN(numeric)) {

            return `₹${numeric.toLocaleString(
                "en-IN"
            )}`;

        }


        return String(value);

    }


    /* =========================================================
       HELPERS
    ========================================================= */

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    function hideMessages() {

        errorBox.style.display =
            "none";

        successBox.style.display =
            "none";

    }


    function showError(
        message
    ) {

        errorBox.innerHTML = `

            <div class="alert alert-danger">
                ${escapeHtml(message)}
            </div>

        `;

        errorBox.style.display =
            "block";

        successBox.style.display =
            "none";

    }


    function showSuccess(
        message
    ) {

        successBox.innerHTML = `

            <div class="alert alert-success">
                ${escapeHtml(message)}
            </div>

        `;

        successBox.style.display =
            "block";

        errorBox.style.display =
            "none";

    }


    /* =========================================================
       CLEAR
    ========================================================= */

    function clearPage() {

        complaintText.value =
            "";

        incidentGrid.innerHTML =
            "";

        incidentSection.style.display =
            "none";

        linkageNext.style.display =
            "none";

        hideMessages();


        sessionStorage.removeItem(
            "linkageX_incident"
        );

        sessionStorage.removeItem(
            "linkageX_results"
        );

        sessionStorage.removeItem(
            "linkageX_original_complaint"
        );

    }

</script>

</body>
</html>
