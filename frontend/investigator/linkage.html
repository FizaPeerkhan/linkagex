<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Case Linkage | LinkageX</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .linkage-input {
            min-height: 190px;
            resize: vertical;
            line-height: 1.6;
        }

        .analysis-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .status-message {
            margin-top: 14px;
        }

        .incident-grid-linkage {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .incident-item {
            background: var(--surface-soft, #f8fafc);
            border: 1px solid var(--border, #e5e7eb);
            border-radius: 10px;
            padding: 13px;
        }

        .incident-item .field-label {
            font-size: 11px;
            color: var(--muted, #6b7280);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .incident-item .field-value {
            font-size: 13px;
            font-weight: 600;
            color: var(--text, #1f2937);
            line-height: 1.45;
            word-break: break-word;
        }

        .linkage-next {
            margin-top: 18px;
            padding: 16px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .linkage-next-text h4 {
            margin: 0 0 4px;
            font-size: 14px;
        }

        .linkage-next-text p {
            margin: 0;
            font-size: 12px;
            color: #6b7280;
        }

        @media (max-width: 900px) {
            .incident-grid-linkage {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .incident-grid-linkage {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>

<script>

    /* =========================================================
       PAGE SHELL
    ========================================================= */

    const c = shell(
        "investigator",
        "Potential Linkages"
    );


    c.innerHTML = pageHead(
        "Case Linkage",
        "Analyze an incident and identify potentially related historical cases.",
        `<a class="btn btn-secondary" href="cases.html">
            ← Case Repository
        </a>`
    );


    /* =========================================================
       COMPLAINT INPUT
    ========================================================= */

    c.innerHTML += `

        <div class="card">

            <div class="section-head">

                <div>

                    <h3>
                        Analyze New Complaint
                    </h3>

                    <p class="card-sub">
                        Enter a cybercrime complaint to structure
                        the incident and compare it against historical cases.
                    </p>

                </div>

            </div>


            <textarea
                id="complaintText"
                class="linkage-input"
                placeholder="Paste or enter the complaint text here…"
            ></textarea>


            <div class="analysis-actions">

                <button
                    id="linkageBtn"
                    class="btn btn-primary"
                    onclick="runLinkage()"
                >
                    Find Related Cases
                </button>


                <button
                    class="btn btn-secondary"
                    onclick="clearPage()"
                >
                    Clear
                </button>

            </div>


            <div
                id="loading"
                class="status-message"
                style="display:none;"
            >

                <div class="alert alert-info">

                    <strong>
                        Analyzing complaint…
                    </strong>

                    <br>

                    Structuring the incident and searching historical cases.

                </div>

            </div>


            <div
                id="error"
                class="status-message"
                style="display:none;"
            ></div>


            <div
                id="success"
                class="status-message"
                style="display:none;"
            ></div>

        </div>

    `;


    /* =========================================================
       STRUCTURED INCIDENT
    ========================================================= */

    c.innerHTML += `

        <div
            id="incident-section"
            class="card"
            style="display:none;"
        >

            <div class="section-head">

                <div>

                    <h3>
                        Structured Incident
                    </h3>

                    <p class="card-sub">
                        Information extracted from the complaint
                        by the LinkageX NLP pipeline.
                    </p>

                </div>


                <span class="tag">
                    NLP Structured
                </span>

            </div>


            <div
                id="incident-grid"
                class="incident-grid-linkage"
            ></div>


            <div
                id="linkage-next"
                class="linkage-next"
                style="display:none;"
            >

                <div class="linkage-next-text">

                    <h4>
                        Potentially Related Cases Found
                    </h4>

                    <p id="linkage-count">
                        Review the historical cases surfaced
                        by the correlation engine.
                    </p>

                </div>


                <a
                    class="btn btn-primary"
                    href="related-cases.html"
                >
                    View Related Cases →
                </a>

            </div>

        </div>

    `;


    /* =========================================================
       CONFIGURATION
    ========================================================= */

    const API_BASE =
        "http://127.0.0.1:5000";


    const complaintText =
        document.getElementById(
            "complaintText"
        );


    const linkageBtn =
        document.getElementById(
            "linkageBtn"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const errorBox =
        document.getElementById(
            "error"
        );


    const successBox =
        document.getElementById(
            "success"
        );


    const incidentSection =
        document.getElementById(
            "incident-section"
        );


    const incidentGrid =
        document.getElementById(
            "incident-grid"
        );


    const linkageNext =
        document.getElementById(
            "linkage-next"
        );


    const linkageCount =
        document.getElementById(
            "linkage-count"
        );


    /* =========================================================
       RUN LINKAGE
    ========================================================= */

    async function runLinkage() {

        const text =
            complaintText.value.trim();


        if (!text) {

            showError(
                "Please enter a complaint before searching."
            );

            return;
        }


        hideMessages();

        // Do not let a failed/new search leave old matches visible.
        sessionStorage.removeItem("linkageX_results");
        sessionStorage.removeItem("linkageX_incident");
        sessionStorage.removeItem("linkageX_original_complaint");

        loading.style.display =
            "block";


        linkageBtn.disabled =
            true;


        incidentSection.style.display =
            "none";


        linkageNext.style.display =
            "none";


        try {

            /* -------------------------------------------------
               STEP 1 — NLP ANALYSIS
            ------------------------------------------------- */

            const analyzeResponse =
                await fetch(
                    `${API_BASE}/api/analyze`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            complaint_text: text
                        })
                    }
                );


            const analyzeData =
                await analyzeResponse.json();


            if (!analyzeResponse.ok) {

                throw new Error(
                    analyzeData.message ||
                    "Complaint analysis failed."
                );

            }


            const incident =
                analyzeData.data.incident;


            /* -------------------------------------------------
               STEP 2 — DISPLAY STRUCTURED INCIDENT
            ------------------------------------------------- */

            displayIncident(
                incident
            );


            /* -------------------------------------------------
               STEP 3 — LINKAGE SEARCH
            ------------------------------------------------- */

            const linkageResponse =
                await fetch(
                    `${API_BASE}/api/linkage`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            incident: {
                                ...incident,
                                complaint_text: incident.complaint_text || text
                            },
                            complaint_text: text
                        })
                    }
                );


            const linkageData =
                await linkageResponse.json();


            if (!linkageResponse.ok) {

                throw new Error(
                    linkageData.message ||
                    "Case linkage failed."
                );

            }


            const results =
                linkageData.results || [];


            /* -------------------------------------------------
               STEP 4 — SAVE RESULTS
            ------------------------------------------------- */

            sessionStorage.setItem(
                "linkageX_incident",
                JSON.stringify({ ...incident, complaint_text: text })
            );

            sessionStorage.setItem(
                "linkageX_original_complaint",
                text
            );

            sessionStorage.setItem(
                "linkageX_results",
                JSON.stringify(results)
            );


            /* -------------------------------------------------
               STEP 5 — SHOW NEXT ACTION
            ------------------------------------------------- */

            linkageNext.style.display =
                "flex";


            linkageCount.textContent =
                results.length
                    ? `${results.length} historical case(s) met the minimum similarity threshold.`
                    : "No historical case met the minimum similarity threshold. The incident can be retained for future comparison.";


            showSuccess(
                results.length
                    ? "Analysis complete. Related cases are ready for review."
                    : "Analysis complete. No significant relationship was identified."
            );

        }


        catch (error) {

            console.error(
                "Linkage error:",
                error
            );


            showError(
                error.message ||
                "Unable to connect to LinkageX backend."
            );

        }


        finally {

            loading.style.display =
                "none";


            linkageBtn.disabled =
                false;

        }

    }


    /* =========================================================
       DISPLAY STRUCTURED INCIDENT
    ========================================================= */

    function displayIncident(
        incident
    ) {

        incidentSection.style.display =
            "block";


        const fields = [

            [
                "Crime Category",
                incident.crime_category
            ],

            [
                "Crime Subcategory",
                incident.crime_subcategory
            ],

            [
                "Modus Operandi",
                formatValue(
                    incident.modus_operandi
                )
            ],

            [
                "Deception",
                formatValue(
                    incident.deception
                )
            ],

            [
                "Victim Action",
                formatValue(
                    incident.victim_action
                )
            ],

            [
                "Attacker Action",
                formatValue(
                    incident.attacker_action
                )
            ],

            [
                "Outcome",
                formatValue(
                    incident.outcome
                )
            ],

            [
                "Channels",
                formatValue(
                    incident.channels
                )
            ],

            [
                "Payment Method",
                formatValue(
                    incident.payment_method
                )
            ],

            [
                "Amount",
                formatAmount(
                    incident.amounts
                )
            ],

            [
                "Organizations",
                formatValue(
                    incident.organizations
                )
            ],

            [
                "Locations",
                formatValue(
                    incident.locations
                )
            ]

        ];


        incidentGrid.innerHTML =
            fields
                .map(
                    ([label, value]) => `

                        <div class="incident-item">

                            <div class="field-label">
                                ${escapeHtml(label)}
                            </div>

                            <div class="field-value">
                                ${escapeHtml(
                                    value ||
                                    "Not identified"
                                )}
                            </div>

                        </div>

                    `
                )
                .join("");

    }


    /* =========================================================
       FORMAT VALUES
    ========================================================= */

    function formatValue(
        value
    ) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {

            return "";

        }


        if (Array.isArray(value)) {

            return value.length
                ? value.join(", ")
                : "";

        }


        return String(value);

    }


    function formatAmount(
        value
    ) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {

            return "";

        }


        if (Array.isArray(value)) {

            if (!value.length) {
                return "";
            }


            return value
                .map(
                    amount =>
                        `₹${Number(
                            amount
                        ).toLocaleString(
                            "en-IN"
                        )}`
                )
                .join(", ");

        }


        const numeric =
            Number(value);


        if (!Number.isNaN(numeric)) {

            return `₹${numeric.toLocaleString(
                "en-IN"
            )}`;

        }


        return String(value);

    }


    /* =========================================================
       HELPERS
    ========================================================= */

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    function hideMessages() {

        errorBox.style.display =
            "none";

        successBox.style.display =
            "none";

    }


    function showError(
        message
    ) {

        errorBox.innerHTML = `

            <div class="alert alert-danger">
                ${escapeHtml(message)}
            </div>

        `;

        errorBox.style.display =
            "block";

        successBox.style.display =
            "none";

    }


    function showSuccess(
        message
    ) {

        successBox.innerHTML = `

            <div class="alert alert-success">
                ${escapeHtml(message)}
            </div>

        `;

        successBox.style.display =
            "block";

        errorBox.style.display =
            "none";

    }


    /* =========================================================
       CLEAR
    ========================================================= */

    function clearPage() {

        complaintText.value =
            "";

        incidentGrid.innerHTML =
            "";

        incidentSection.style.display =
            "none";

        linkageNext.style.display =
            "none";

        hideMessages();


        sessionStorage.removeItem(
            "linkageX_incident"
        );

        sessionStorage.removeItem(
            "linkageX_results"
        );

        sessionStorage.removeItem(
            "linkageX_original_complaint"
        );

    }

</script>

</body>
</html>
