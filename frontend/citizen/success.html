<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incident Submitted — LinkageX</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305070d'/%3E%3Ccircle cx='9' cy='10' r='2.6' fill='%2354d9ff'/%3E%3Ccircle cx='23' cy='9' r='2.2' fill='%2354d9ff'/%3E%3Ccircle cx='16' cy='22' r='2.6' fill='%23ffb454'/%3E%3Cpath d='M9 10 L23 9 M9 10 L16 22 M23 9 L16 22' stroke='%2354d9ff' stroke-width='1' opacity='.6'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --void: #05070d;
      --panel: #0a0f18;
      --panel-2: #0d1420;
      --line: rgba(148,197,224,.14);
      --line-strong: rgba(148,197,224,.28);
      --ink: #e9f1f8;
      --ink-dim: #8fa0b6;
      --ink-faint: #5b6a80;
      --cyan: #54d9ff;
      --cyan-soft: rgba(84,217,255,.16);
      --amber: #ffb454;
      --amber-soft: rgba(255,180,84,.16);
      --violet: #b98bff;
      --green: #5ee69b;
      --red: #ff7a7a;
      --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --display: 'Space Grotesk', var(--sans);
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
      --sidebar-w: 248px;
      --topbar-h: 64px;
    }

    * { box-sizing: border-box; }

    html { -webkit-font-smoothing: antialiased; }

    body {
      margin: 0;
      background: var(--void);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.55;
    }

    a { color: inherit; text-decoration: none; }
    img, svg { display: block; }
    p { margin: 0; }
    button { font-family: var(--sans); }

    h1, h2, h3, h4 {
      font-family: var(--display);
      font-weight: 600;
      margin: 0;
    }

    ::selection { background: var(--cyan-soft); color: var(--ink); }

    :focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    /* APPLICATION SHELL */

    .app-shell {
      position: relative;
      display: flex;
      min-height: 100vh;
    }

    .app-shell::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 64px 64px;
      opacity: .22;
      mask-image: radial-gradient(ellipse 90% 70% at 20% 0%, black, transparent 75%);
    }

    .sidebar {
      position: relative;
      z-index: 2;
      width: var(--sidebar-w);
      flex: 0 0 var(--sidebar-w);
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      padding: 22px 0 18px;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 22px 22px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-brand svg {
      width: 26px;
      height: 26px;
      flex: 0 0 auto;
    }

    .sidebar-brand span {
      font-family: var(--display);
      font-weight: 600;
      font-size: 1rem;
    }

    .sidebar-role {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .04em;
      color: var(--cyan);
      padding: 16px 22px 10px;
      text-transform: uppercase;
    }

    .sidebar-nav {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
      flex: 1;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 22px;
      font-size: .9rem;
      color: var(--ink-dim);
      border-left: 2px solid transparent;
      transition: color .18s, background .18s, border-color .18s;
    }

    .sidebar-nav a svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      opacity: .85;
    }

    .sidebar-nav a:hover {
      color: var(--ink);
      background: rgba(148,197,224,.05);
    }

    .sidebar-nav a.active {
      color: var(--cyan);
      background: var(--cyan-soft);
      border-left-color: var(--cyan);
    }

    .sidebar-foot {
      padding: 14px 22px 0;
      margin-top: 10px;
      border-top: 1px solid var(--line);
    }

    .sidebar-foot a {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .85rem;
      color: var(--ink-faint);
      padding-top: 14px;
    }

    .sidebar-foot a:hover { color: var(--red); }

    .sidebar-foot a svg {
      width: 16px;
      height: 16px;
    }

    /* TOPBAR */

    .main-col {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: var(--topbar-h);
      flex: 0 0 var(--topbar-h);
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 30px;
      background: rgba(10,15,24,.72);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-crumb {
      font-family: var(--mono);
      font-size: .76rem;
      color: var(--ink-faint);
      letter-spacing: .02em;
    }

    .topbar-crumb b {
      color: var(--ink-dim);
      font-weight: 500;
    }

    .topbar-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-chip {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--cyan-soft);
      border: 1px solid var(--line-strong);
      color: var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--display);
      font-weight: 600;
      font-size: .85rem;
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .user-meta b {
      font-size: .85rem;
      font-weight: 500;
    }

    .user-meta span {
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 34px 34px 70px;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .page-head h1 {
      font-size: clamp(1.4rem, 2.4vw, 1.9rem);
      letter-spacing: -.01em;
      margin-bottom: 8px;
    }

    .page-head p {
      color: var(--ink-dim);
      font-size: .95rem;
      max-width: 56ch;
    }

    /* COMPONENTS */

    .steps {
      display: flex;
      align-items: center;
      gap: 0;
      margin: 0 0 24px;
      padding: 12px 16px;
      background: var(--panel);
      border: 1px solid var(--line-strong);
      overflow-x: auto;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: .7rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .step .num {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-strong);
      background: var(--panel-2);
      color: var(--ink-faint);
      font-family: var(--mono);
    }

    .step.active { color: var(--cyan); }

    .step.active .num {
      color: var(--cyan);
      border-color: var(--cyan);
      background: var(--cyan-soft);
    }

    .step-line {
      height: 1px;
      flex: 1;
      min-width: 28px;
      margin: 0 12px;
      background: var(--line-strong);
    }

    .card {
      position: relative;
      background: var(--panel-2);
      border: 1px solid var(--line-strong);
      padding: 24px;
      min-width: 0;
    }

    .card::before, .card::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
    }

    .card::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid var(--cyan);
      border-left: 2px solid var(--cyan);
    }

    .card::after {
      bottom: -1px;
      right: -1px;
      border-bottom: 2px solid var(--cyan);
      border-right: 2px solid var(--cyan);
    }

    .eyebrow-dark {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 7px;
    }

    .note, .muted {
      color: var(--ink-dim);
      font-size: .84rem;
      line-height: 1.65;
    }

    .callout-title {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 12px;
    }

    .success-card {
      max-width: 760px;
      margin: 36px auto;
      text-align: center;
      padding: 42px 30px;
    }

    .success-mark {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(94,230,155,.12);
      border: 1px solid rgba(94,230,155,.35);
      color: var(--green);
      display: grid;
      place-items: center;
      font-size: 30px;
      margin: 0 auto 18px;
    }

    .success-card h1 {
      font-size: 1.7rem;
      margin-bottom: 8px;
    }

    .success-card .eyebrow-dark { margin-bottom: 8px; }

    .case-id-card {
      background: var(--panel);
      border: 1px solid var(--line-strong);
      padding: 22px;
      margin: 25px 0;
    }

    .case-id-card strong {
      font-family: var(--mono);
      font-size: 1.7rem;
      color: var(--ink);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 9px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      font: 500 .68rem var(--mono);
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .status-new {
      color: var(--amber);
      background: var(--amber-soft);
      border-color: rgba(255,180,84,.35);
    }

    .status-new::before {
      background: var(--amber);
      box-shadow: 0 0 6px var(--amber);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border: none;
      cursor: pointer;
      font-family: var(--sans);
      font-weight: 500;
      font-size: .87rem;
      transition: filter .2s, transform .2s, background .2s, border-color .2s;
    }

    .btn-primary {
      background: var(--cyan);
      color: var(--void);
      clip-path: polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
    }

    .btn-primary:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--line-strong);
      color: var(--ink);
    }

    .btn-secondary:hover {
      border-color: var(--cyan);
      background: var(--cyan-soft);
    }

    .toast-root {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .toast {
      background: var(--panel-2);
      border: 1px solid var(--cyan);
      color: var(--ink);
      padding: 11px 18px;
      font-size: .86rem;
      box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }

    @media (max-width: 900px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        transition: transform .25s;
        z-index: 40;
      }

      .sidebar.open { transform: translateX(0); }
      .content { padding: 24px 18px 60px; }
      .topbar { padding: 0 18px; }
    }

    @media (max-width: 640px) {
      .steps { padding: 10px 12px; }
      .step-line { margin: 0 8px; }
      .card { padding: 20px; }
      .success-card { margin: 25px auto; padding: 34px 20px; }
      .actions { justify-content: center; }
      .actions .btn { width: 100%; }
    }
  </style>
</head>

<body>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>

  <script>
    (function () {
      let storedAccount = null;

      try {
        storedAccount = JSON.parse(
          localStorage.getItem("linkageXCitizenAccount") || "null"
        );
      } catch (error) {}

      const citizenName =
        (storedAccount && storedAccount.name) ||
        sessionStorage.getItem("linkageXCitizenName") ||
        "Citizen";

      const citizenInitial =
        (citizenName.trim().charAt(0) || "C").toUpperCase();

      const icons = {
        dashboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>',
        complaint: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg>',
        list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
        awareness: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M12 8v5M12 16.2h.01"/></svg>',
        guidance: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.5 2.5 0 014.9.8c0 1.7-2.4 2-2.4 3.6M12 17.2h.01"/></svg>',
        signout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>'
      };

      const nav = [
        ["dashboard", "Dashboard", "dashboard.html"],
        ["complaint", "Submit Complaint", "complaint.html"],
        ["list", "My Complaints", "complaints.html"],
        ["awareness", "Regional Awareness", "awareness.html"],
        ["guidance", "Safety Center", "guidance.html"]
      ];

      const navHTML = nav.map(function (item) {
        const icon = item[0];
        const label = item[1];
        const href = item[2];

        return `
          <li>
            <a class="${label === "Submit Complaint" ? "active" : ""}" href="${href}">
              ${icons[icon]}<span>${label}</span>
            </a>
          </li>`;
      }).join("");

      const brandSVG = `
        <svg viewBox="0 0 30 30">
          <circle cx="8" cy="9" r="2.6" fill="#54d9ff"/>
          <circle cx="22" cy="8" r="2.2" fill="#54d9ff"/>
          <circle cx="15" cy="21" r="2.6" fill="#ffb454"/>
          <path d="M8 9L22 8M8 9L15 21M22 8L15 21"
                stroke="#54d9ff" stroke-width="1" opacity=".55"/>
        </svg>`;

      document.body.innerHTML = `
        <div class="app-shell">
          <aside class="sidebar">
            <div class="sidebar-brand">
              ${brandSVG}<span>LinkageX</span>
            </div>

            <div class="sidebar-role">Citizen Portal</div>

            <ul class="sidebar-nav">${navHTML}</ul>

            <div class="sidebar-foot">
              <a href="#" id="signOutLink">
                ${icons.signout}<span>Sign out</span>
              </a>
            </div>
          </aside>

          <div class="main-col">
            <header class="topbar">
              <div class="topbar-crumb">
                LinkageX / <b>Report</b>
              </div>

              <a class="topbar-user" href="profile.html" aria-label="Open profile">
                <div class="user-meta">
                  <b></b>
                  <span>citizen</span>
                </div>
                <div class="user-chip"></div>
              </a>
            </header>

            <main class="content" id="pageContent"></main>
          </div>
        </div>

        <div id="toast-root" class="toast-root"></div>
      `;

      document.querySelector(".user-meta b").textContent = citizenName;
      document.querySelector(".user-chip").textContent = citizenInitial;

      const signOut = document.getElementById("signOutLink");

      signOut.addEventListener("click", function (event) {
        event.preventDefault();

        if (typeof toast === "function") {
          toast("Signed out (prototype only).");
        }
      });

      const c = document.getElementById("pageContent");

      function pageHead(title, subtitle) {
        return `
          <div class="page-head">
            <div>
              <h1>${title}</h1>
              <p>${subtitle}</p>
            </div>
          </div>`;
      }

      c.innerHTML = pageHead(
        "Incident Submitted",
        "Your complaint has been successfully recorded in the LinkageX prototype."
      );

      c.innerHTML += `
        <div class="steps">
          <div class="step"><span class="num">1</span> Describe</div>
          <div class="step-line"></div>
          <div class="step"><span class="num">2</span> Understand</div>
          <div class="step-line"></div>
          <div class="step"><span class="num">3</span> Review</div>
          <div class="step-line"></div>
          <div class="step active"><span class="num">4</span> Submit</div>
        </div>

        <div class="card success-card">
          <div class="success-mark">✓</div>
          <div class="eyebrow-dark">SUBMISSION COMPLETE</div>

          <h1>Incident Submitted</h1>

          <p class="note">
            Your complaint has been successfully recorded.
            Keep the case ID below for reference.
          </p>

          <div class="case-id-card">
            <div class="callout-title">Case ID</div>
            <strong>CC001</strong>
            <div style="margin-top:12px">
              ${typeof badge === "function" ? badge("Submitted") : '<span class="status status-new">Submitted</span>'}
            </div>
          </div>

          <p class="note">
            This confirms that the incident was recorded by the prototype.
            It does not imply that authorities have already investigated the case.
          </p>

          <div class="actions" style="justify-content:center;margin-top:22px">
            <a class="btn btn-primary" href="complaints.html">View Incident</a>
            <a class="btn btn-secondary" href="guidance.html">What Should You Do Now?</a>
            <a class="btn btn-secondary" href="dashboard.html">Dashboard</a>
          </div>
        </div>
      `;
    })();
  </script>
</body>
</html>
