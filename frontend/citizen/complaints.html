<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>My Complaints</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const c=shell("citizen","My Complaints");c.innerHTML=pageHead("My Complaints","Review incidents you have submitted through the platform.");
        c.innerHTML+=`<div class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Case ID</th><th>Crime Type</th><th>Date</th><th>Status</th></tr></thead><tbody>${CS.complaints.map(x=>`<tr onclick="location.href='complaints.html?case=${x[0]}'"><td><strong>${x[0]}</strong></td><td>${x[1]}</td><td>${x[2]}</td><td>${badge(x[3])}</td></tr>`).join("")}</tbody></table></div></div>`;
        const caseId=new URLSearchParams(location.search).get("case");if(caseId){c.innerHTML+=`<div class="section">${renderIncident(CS.incident)}<div class="actions" style="margin-top:14px"><a class="btn btn-secondary" href="guidance.html">View Guidance</a></div></div>`}
    </script>
</body>
</html>
