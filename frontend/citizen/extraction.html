<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>LinkageX — Extracted Incident</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

    <style>
        .entity-context-item { margin: 0 0 10px; line-height: 1.45; overflow-wrap: anywhere; }
        .entity-context-item:last-child { margin-bottom: 0; }
        .context-detail { margin-top: 3px; color: #64748b; font-size: 0.88em; }
        .context-detail span { font-weight: 600; }
    </style>
</head>


<body>

    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>


    <script>

        /* =====================================================
           APPLICATION SHELL
        ====================================================== */

        const c =
            shell(
                "citizen",
                "Report"
            );



        /* =====================================================
           GET NLP RESULT
        ====================================================== */

        const analysisJSON =
            sessionStorage.getItem(
                "linkageX_analysis"
            );



        /* =====================================================
           NO ANALYSIS FOUND
        ====================================================== */

        if (!analysisJSON) {

            c.innerHTML =
                pageHead(
                    "No Analysis Found",
                    "We could not find the analyzed complaint. Please submit your complaint again."
                );


            c.innerHTML += `

                <div class="card">

                    <div class="alert alert-warn">

                        <strong>
                            Analysis unavailable.
                        </strong>

                        <p>
                            Please return to the complaint page
                            and submit your report again.
                        </p>

                    </div>


                    <div
                        class="actions"
                        style="margin-top:18px"
                    >

                        <a
                            class="btn btn-primary"
                            href="complaint.html"
                        >
                            Back to Complaint
                        </a>

                    </div>

                </div>

            `;

        }


        /* =====================================================
           ANALYSIS FOUND
        ====================================================== */

        else {

            let result;

            try {

                result =
                    JSON.parse(
                        analysisJSON
                    );

            }

            catch (error) {

                console.error(
                    "Unable to parse NLP result:",
                    error
                );


                c.innerHTML =
                    pageHead(
                        "Analysis Error",
                        "The complaint analysis could not be read."
                    );


                c.innerHTML += `

                    <div class="card">

                        <div class="alert alert-warn">

                            <strong>
                                Invalid analysis data.
                            </strong>

                            <p>
                                Please submit the complaint again.
                            </p>

                        </div>


                        <div
                            class="actions"
                            style="margin-top:18px"
                        >

                            <a
                                class="btn btn-primary"
                                href="complaint.html"
                            >
                                Back to Complaint
                            </a>

                        </div>

                    </div>

                `;


                throw error;

            }



            /* =================================================
               EXTRACT INCIDENT
            ================================================== */

            const data = result.data || {};
const incident = data.incident || {};
const missingFields = data.missing_fields || [];



            /* =================================================
               PAGE HEADER
            ================================================== */

            c.innerHTML =
                pageHead(
                    "We Understood Your Incident",
                    "The system extracted the following information from your complaint. Please review and confirm it before continuing."
                );



            /* =================================================
               REVIEW NOTICE
            ================================================== */

            c.innerHTML += `

                <div
                    class="alert alert-info"
                    style="margin-bottom:16px"
                >

                    <strong>
                        Review before continuing:
                    </strong>

                    Extracted information is based on
                    your complaint text. Please confirm
                    the details and provide any missing
                    information before submitting your report.

                </div>

            `;



            /* =================================================
               DISPLAY VALUE
            ================================================== */

            function displayEntityItem(item) {
                if (item === null || item === undefined) return "";

                if (typeof item === "string" || typeof item === "number") {
                    return String(item).trim();
                }

                if (Array.isArray(item)) {
                    return item.map(displayEntityItem).filter(Boolean).join(", ");
                }

                if (typeof item === "object") {
                    const preferredKeys = [
                        "value", "text", "number", "phone", "phone_number",
                        "email", "upi", "upi_id", "url", "domain", "address",
                        "identifier", "raw", "matched_text", "entity"
                    ];

                    for (const key of preferredKeys) {
                        const candidate = item[key];
                        if (
                            (typeof candidate === "string" ||
                             typeof candidate === "number") &&
                            String(candidate).trim() !== ""
                        ) {
                            return String(candidate).trim();
                        }
                    }

                    const primitives = Object.values(item)
                        .filter(value =>
                            (typeof value === "string" ||
                             typeof value === "number") &&
                            String(value).trim() !== ""
                        )
                        .map(value => String(value).trim());

                    return [...new Set(primitives)].join(" · ");
                }

                return "";
            }

            function displayValue(value) {
                if (value === null || value === undefined) {
                    return "Not provided";
                }

                if (Array.isArray(value)) {
                    const items = value.map(displayEntityItem).filter(Boolean);
                    return items.length
                        ? [...new Set(items)].join(", ")
                        : "Not provided";
                }

                if (typeof value === "object") {
                    return displayEntityItem(value) || "Not provided";
                }

                if (typeof value === "string" && value.trim() === "") {
                    return "Not provided";
                }

                return String(value);
            }


            /* =================================================
               CHECK WHETHER VALUE EXISTS
            ================================================== */

            function hasValue(value) {

                if (
                    value === null ||
                    value === undefined
                ) {

                    return false;

                }


                if (
                    Array.isArray(value)
                ) {

                    return value.length > 0;

                }


                if (
                    typeof value === "string"
                ) {

                    return value.trim().length > 0;

                }


                return true;

            }



            /* =================================================
               FIELD STATUS
            ================================================== */

function statusFor(value, fieldName) {

    // Backend explicitly marked this field as missing
    if (missingFields.includes(fieldName)) {

        return `
            <span class="badge badge-warn">
                Needs confirmation
            </span>
        `;

    }

    // NLP successfully extracted a value
    if (hasValue(value)) {

        return `
            <span class="badge badge-success">
                Extracted
            </span>
        `;

    }

    // Field is optional and was not detected
    return `
        <span class="badge">
            Not detected
        </span>
    `;
}


            /* =================================================
               FORMAT AMOUNTS
            ================================================== */

            function escapeHTML(value) {
                return String(value ?? "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function formatAmount(value) {
                const number = Number(value);
                return Number.isFinite(number)
                    ? "₹" + number.toLocaleString("en-IN")
                    : escapeHTML(value);
            }

            function displayContextualDetails(details, fallback, kind) {
                if (!Array.isArray(details) || details.length === 0) {
                    return escapeHTML(displayValue(fallback));
                }

                return details.map(item => {
                    const value = kind === "amount"
                        ? formatAmount(item.value)
                        : escapeHTML(displayEntityItem(item.value));
                    const meaning = item.meaning
                        ? `<strong>${escapeHTML(item.meaning)}</strong>`
                        : "Context not established";
                    const context = item.context
                        ? `<div class="context-detail"><span>Complaint context:</span> ${escapeHTML(item.context)}</div>`
                        : `<div class="context-detail">No matching sentence context was found.</div>`;
                    return `<div class="entity-context-item"><div>${meaning}: ${value}</div>${context}</div>`;
                }).join("");
            }

            function displayAmounts(amounts) {
                if (!Array.isArray(amounts) || amounts.length === 0) {
                    return "Not provided";
                }
                return amounts.map(formatAmount).join(", ");
            }



            /* =================================================
               BUILD FIELD LIST
            ================================================== */

            const fields = [

                [
                    "Crime Category",

                    incident.crime_category,

                    "crime_category"

                ],


                [
                    "Crime Type",

                    incident.crime_subcategory,

                    "crime_subcategory"

                ],


                [
                    "Channel",

                    incident.channels,

                    "channels"

                ],


                [
                    "Deception Method",

                    incident.deception,

                    "deception"

                ],


                [
                    "Victim Action",

                    incident.victim_action,

                    "victim_action"

                ],


                [
                    "Attacker Action",

                    incident.attacker_action,

                    "attacker_action"

                ],


                [
                    "Outcome",

                    incident.outcome,

                    "outcome"

                ],


                [
                    "Payment Method",

                    incident.payment_method,

                    "payment_method"

                ],


                [
                    "Amount",

                    incident.amounts,

                    "amounts"

                ],


                [
                    "Organizations",

                    incident.organizations,

                    "organizations"

                ],


                [
                    "Location",

                    hasValue(incident.location_mentions)
                        ? incident.location_mentions
                        : incident.locations,

                    "locations"

                ]

            ];

/* =================================================
               RENDER TABLE
            ================================================== */

            c.innerHTML += `

                <div class="card">

                    <div class="section-head">

                        <h3>
                            Extracted Incident Information
                        </h3>

                        <span>
                            NLP-generated representation
                        </span>

                    </div>


                    <div class="table-wrap">

                        <table class="data-table">

                            <thead>

                                <tr>

                                    <th>
                                        Field
                                    </th>

                                    <th>
                                        Extracted Information
                                    </th>

                                    <th>
                                        Status
                                    </th>

                                </tr>

                            </thead>


                            <tbody>

                                ${

                                    fields
                                        .map(
                                            field => {

                                                const label =
                                                    field[0];

                                                const rawValue =
                                                    field[1];

                                                const key =
                                                    field[2];


                                                const value =

                                                    key === "amounts"
                                                        ? displayContextualDetails(
                                                            incident.amount_details,
                                                            rawValue,
                                                            "amount"
                                                        )
                                                        : key === "locations"
                                                            ? displayContextualDetails(
                                                                incident.location_details,
                                                                hasValue(incident.location_mentions) ? incident.location_mentions : rawValue,
                                                                "location"
                                                            )
                                                            : displayValue(rawValue);


                                                return `

                                                    <tr>

                                                        <td>

                                                            <strong>
                                                                ${label}
                                                            </strong>

                                                        </td>


                                                        <td>

                                                            ${value}

                                                        </td>


                                                        <td>

                                                            ${statusFor(
                                                                rawValue,
                                                                key
                                                            )}

                                                        </td>

                                                    </tr>

                                                `;

                                            }
                                        )
                                        .join("")

                                }

                            </tbody>

                        </table>

                    </div>



                    <!-- =====================================
                         ENTITY DETAILS
                    ====================================== -->

                    <div
                        class="divider"
                        style="margin:22px 0"
                    ></div>


                    <div class="section-head">

                        <h3>
                            Extracted Indicators
                        </h3>

                        <span>
                            Additional information detected from the complaint
                        </span>

                    </div>


                    <div class="incident-grid">


                        ${

                            field(
                                "Phone Numbers",
                                "__LINKAGEX_CONTEXT_PHONES__",
                                "phones",
                                false
                            )

                        }


                        ${

                            field(
                                "Email Addresses",
                                "__LINKAGEX_CONTEXT_EMAILS__",
                                "emails",
                                false
                            )

                        }


                        ${

                            field(
                                "UPI IDs",
                                "__LINKAGEX_CONTEXT_UPI__",
                                "upi_ids",
                                false
                            )

                        }


                        ${

                            field(
                                "URLs",
                                "__LINKAGEX_CONTEXT_URLS__",
                                "urls",
                                false
                            )

                        }


                    </div>



                    <!-- =====================================
                         ACTIONS
                    ====================================== -->

                    <div
                        class="actions"
                        style="margin-top:22px"
                    >

                        <a
                            class="btn btn-primary"
                            href="missing-info.html"
                        >

                            Continue Review →

                        </a>


                        <a
                            class="btn btn-secondary"
                            href="complaint.html"
                        >

                            Back

                        </a>

                    </div>


                </div>

            `;

            /* =================================================
               RENDER CONTEXTUAL INDICATORS SAFELY

               The shared field() helper escapes values as text.
               Keep it for the original layout, then replace only
               our unique text placeholders with DOM-rendered
               contextual details. Existing CSS/layout is unchanged.
            ================================================== */

            function replaceContextPlaceholder(marker, details, fallback, kind) {
                const walker = document.createTreeWalker(
                    c,
                    NodeFilter.SHOW_TEXT
                );

                const textNodes = [];
                while (walker.nextNode()) {
                    if (walker.currentNode.nodeValue.includes(marker)) {
                        textNodes.push(walker.currentNode);
                    }
                }

                for (const textNode of textNodes) {
                    const sourceText = textNode.nodeValue;
                    const markerIndex = sourceText.indexOf(marker);
                    if (markerIndex < 0) continue;

                    const before = sourceText.slice(0, markerIndex);
                    const after = sourceText.slice(markerIndex + marker.length);
                    const fragment = document.createDocumentFragment();

                    if (before) {
                        fragment.appendChild(document.createTextNode(before));
                    }

                    const template = document.createElement("template");
                    template.innerHTML = displayContextualDetails(
                        details,
                        fallback,
                        kind
                    );
                    fragment.appendChild(template.content);

                    if (after) {
                        fragment.appendChild(document.createTextNode(after));
                    }

                    textNode.replaceWith(fragment);
                }
            }

            replaceContextPlaceholder(
                "__LINKAGEX_CONTEXT_PHONES__",
                incident.phone_details,
                incident.phones,
                "phone"
            );

            replaceContextPlaceholder(
                "__LINKAGEX_CONTEXT_EMAILS__",
                incident.email_details,
                incident.emails,
                "email"
            );

            replaceContextPlaceholder(
                "__LINKAGEX_CONTEXT_UPI__",
                incident.upi_details,
                incident.upi_ids,
                "upi"
            );

            replaceContextPlaceholder(
                "__LINKAGEX_CONTEXT_URLS__",
                incident.url_details,
                incident.urls,
                "url"
            );

        }

    </script>

</body>

</html>
