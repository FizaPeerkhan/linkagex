<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>LinkageX — Extracted Incident</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{--void:#05070d;--panel:#0a0f18;--panel-2:#0d1420;--line:rgba(148,197,224,.14);--line-strong:rgba(148,197,224,.28);--ink:#e9f1f8;--ink-dim:#8fa0b6;--ink-faint:#5b6a80;--cyan:#54d9ff;--cyan-soft:rgba(84,217,255,.16);--amber:#ffb454;--amber-soft:rgba(255,180,84,.16);--violet:#b98bff;--green:#5ee69b;--red:#ff7a7a;--sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;--display:'Space Grotesk',var(--sans);--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}html{min-height:100%;background:var(--void)}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(ellipse at 50% -20%,rgba(84,217,255,.08),transparent 50%),var(--void);font-family:var(--sans);line-height:1.55;font-size:14px}button,input,select,textarea{font:inherit}a{color:var(--cyan);text-decoration:none}a:hover{color:#a6edff}h1,h2,h3,h4,strong,b{color:inherit}h1,h2,h3{font-family:var(--display);letter-spacing:-.025em}h1{font-size:clamp(25px,3vw,36px);line-height:1.15;margin:0 0 8px}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:0}p{color:var(--ink-dim)}
.card,.section,.panel{background:linear-gradient(145deg,rgba(13,20,32,.98),rgba(8,13,22,.98));border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 45px rgba(0,0,0,.16)}.card{padding:22px;margin:0 0 18px}.section-head,.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}.page-head{margin:0 0 22px}.page-head p{margin:0;max-width:760px}.section-head{margin-bottom:16px}.section-head h2,.section-head h3{font-family:var(--display)}
.table-wrap{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:10px}table,.data-table{width:100%;border-collapse:collapse;color:var(--ink)}th{text-align:left;padding:12px 14px;background:rgba(84,217,255,.055);color:var(--ink-dim);font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--line-strong)}td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:rgba(84,217,255,.025)}
.badge,.status-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:4px 9px;font-size:11px;font-weight:600;background:rgba(148,197,224,.07);color:var(--ink-dim)}.badge-success,.status-success{color:var(--green);border-color:rgba(94,230,155,.3);background:rgba(94,230,155,.08)}.badge-warn,.status-warn{color:var(--amber);border-color:rgba(255,180,84,.3);background:rgba(255,180,84,.08)}.badge-danger,.status-danger{color:var(--red);border-color:rgba(255,122,122,.3);background:rgba(255,122,122,.08)}
.alert{padding:14px 16px;border-radius:10px;border:1px solid var(--line-strong);background:rgba(84,217,255,.06);color:var(--ink-dim)}.alert strong{color:var(--ink)}.alert p{margin:6px 0 0}.alert-info{border-color:rgba(84,217,255,.28);background:rgba(84,217,255,.07)}.alert-warn{border-color:rgba(255,180,84,.3);background:rgba(255,180,84,.07)}
.btn,.actions a{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);border-radius:9px;padding:10px 15px;background:rgba(148,197,224,.06);color:var(--ink);font-weight:600;transition:background .15s,border-color .15s;cursor:pointer}.btn:hover,.actions a:hover{background:rgba(84,217,255,.1);border-color:var(--cyan);color:var(--ink)}.btn-primary{background:var(--cyan);border-color:var(--cyan);color:#031018}.btn-primary:hover{background:#a6edff;border-color:#a6edff;color:#031018}.btn-secondary{background:rgba(148,197,224,.05)}.actions{display:flex;flex-wrap:wrap;gap:10px}.divider{height:1px;border:0;background:var(--line);margin:22px 0}
.incident-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.incident-grid>div,.incident-grid>section{min-width:0;padding:14px 15px;background:rgba(148,197,224,.035);border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere}.incident-grid h4,.incident-grid .label{color:var(--ink-faint);font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}.incident-grid p,.incident-grid .value{margin:0;color:var(--ink)}.entity-context-item{margin:0 0 12px;line-height:1.5;overflow-wrap:anywhere}.entity-context-item:last-child{margin-bottom:0}.context-detail{margin-top:5px;padding-left:10px;border-left:2px solid var(--line-strong);color:var(--ink-dim);font-size:.9em}.context-detail span{color:var(--cyan);font-weight:600}pre,code{font-family:var(--mono)}
@media(max-width:720px){.card{padding:16px}.incident-grid{grid-template-columns:minmax(0,1fr)}.page-head{gap:10px}th,td{padding:10px}.actions .btn{width:100%}}

    </style>
    <link rel="stylesheet" href="../css/style.css">
</head>


<body>

    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>


    <script>

        /* =====================================================
           APPLICATION SHELL
        ====================================================== */

        const c =
            shell(
                "citizen",
                "Report"
            );



        /* =====================================================
           GET NLP RESULT
        ====================================================== */

        const analysisJSON =
            sessionStorage.getItem(
                "linkageX_analysis"
            );



        /* =====================================================
           NO ANALYSIS FOUND
        ====================================================== */

        if (!analysisJSON) {

            c.innerHTML =
                pageHead(
                    "No Analysis Found",
                    "We could not find the analyzed complaint. Please submit your complaint again."
                );


            c.innerHTML += `

                <div class="card">

                    <div class="alert alert-warn">

                        <strong>
                            Analysis unavailable.
                        </strong>

                        <p>
                            Please return to the complaint page
                            and submit your report again.
                        </p>

                    </div>


                    <div
                        class="actions"
                        style="margin-top:18px"
                    >

                        <a
                            class="btn btn-primary"
                            href="complaint.html"
                        >
                            Back to Complaint
                        </a>

                    </div>

                </div>

            `;

        }


        /* =====================================================
           ANALYSIS FOUND
        ====================================================== */

        else {

            let result;

            try {

                result =
                    JSON.parse(
                        analysisJSON
                    );

            }

            catch (error) {

                console.error(
                    "Unable to parse NLP result:",
                    error
                );


                c.innerHTML =
                    pageHead(
                        "Analysis Error",
                        "The complaint analysis could not be read."
                    );


                c.innerHTML += `

                    <div class="card">

                        <div class="alert alert-warn">

                            <strong>
                                Invalid analysis data.
                            </strong>

                            <p>
                                Please submit the complaint again.
                            </p>

                        </div>


                        <div
                            class="actions"
                            style="margin-top:18px"
                        >

                            <a
                                class="btn btn-primary"
                                href="complaint.html"
                            >
                                Back to Complaint
                            </a>

                        </div>

                    </div>

                `;


                throw error;

            }



            /* =================================================
               EXTRACT INCIDENT
            ================================================== */

            const data = result.data || {};
const incident = data.incident || {};
const missingFields = data.missing_fields || [];



            /* =================================================
               PAGE HEADER
            ================================================== */

            c.innerHTML =
                pageHead(
                    "We Understood Your Incident",
                    "The system extracted the following information from your complaint. Please review and confirm it before continuing."
                );



            /* =================================================
               REVIEW NOTICE
            ================================================== */

            c.innerHTML += `

                <div
                    class="alert alert-info"
                    style="margin-bottom:16px"
                >

                    <strong>
                        Review before continuing:
                    </strong>

                    Extracted information is based on
                    your complaint text. Please confirm
                    the details and provide any missing
                    information before submitting your report.

                </div>

            `;



            /* =================================================
               DISPLAY VALUE
            ================================================== */

            function displayEntityItem(item) {
                if (item === null || item === undefined) return "";

                if (typeof item === "string" || typeof item === "number") {
                    return String(item).trim();
                }

                if (Array.isArray(item)) {
                    return item.map(displayEntityItem).filter(Boolean).join(", ");
                }

                if (typeof item === "object") {
                    const preferredKeys = [
                        "value", "text", "number", "phone", "phone_number",
                        "email", "upi", "upi_id", "url", "domain", "address",
                        "identifier", "raw", "matched_text", "entity"
                    ];

                    for (const key of preferredKeys) {
                        const candidate = item[key];
                        if (
                            (typeof candidate === "string" ||
                             typeof candidate === "number") &&
                            String(candidate).trim() !== ""
                        ) {
                            return String(candidate).trim();
                        }
                    }

                    const primitives = Object.values(item)
                        .filter(value =>
                            (typeof value === "string" ||
                             typeof value === "number") &&
                            String(value).trim() !== ""
                        )
                        .map(value => String(value).trim());

                    return [...new Set(primitives)].join(" · ");
                }

                return "";
            }

            function displayValue(value) {
                if (value === null || value === undefined) {
                    return "Not provided";
                }

                if (Array.isArray(value)) {
                    const items = value.map(displayEntityItem).filter(Boolean);
                    return items.length
                        ? [...new Set(items)].join(", ")
                        : "Not provided";
                }

                if (typeof value === "object") {
                    return displayEntityItem(value) || "Not provided";
                }

                if (typeof value === "string" && value.trim() === "") {
                    return "Not provided";
                }

                return String(value);
            }


            /* =================================================
               CHECK WHETHER VALUE EXISTS
            ================================================== */

            function hasValue(value) {

                if (
                    value === null ||
                    value === undefined
                ) {

                    return false;

                }


                if (
                    Array.isArray(value)
                ) {

                    return value.length > 0;

                }


                if (
                    typeof value === "string"
                ) {

                    return value.trim().length > 0;

                }


                return true;

            }



            /* =================================================
               FIELD STATUS
            ================================================== */

function statusFor(value, fieldName) {

    // Backend explicitly marked this field as missing
    if (missingFields.includes(fieldName)) {

        return `
            <span class="badge badge-warn">
                Needs confirmation
            </span>
        `;

    }

    // NLP successfully extracted a value
    if (hasValue(value)) {

        return `
            <span class="badge badge-success">
                Extracted
            </span>
        `;

    }

    // Field is optional and was not detected
    return `
        <span class="badge">
            Not detected
        </span>
    `;
}


            /* =================================================
               FORMAT AMOUNTS
            ================================================== */

            function escapeHTML(value) {
                return String(value ?? "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function formatAmount(value) {
                const number = Number(value);
                return Number.isFinite(number)
                    ? "₹" + number.toLocaleString("en-IN")
                    : escapeHTML(value);
            }

            function displayContextualDetails(details, fallback, kind) {
                if (!Array.isArray(details) || details.length === 0) {
                    return displayValue(fallback);
                }

                return details.map(item => {
                    const value = kind === "amount"
                        ? formatAmount(item.value)
                        : escapeHTML(displayEntityItem(item.value));
                    const meaning = item.meaning
                        ? `<strong>${escapeHTML(item.meaning)}</strong>`
                        : "Context not established";
                    const context = item.context
                        ? `<div class="context-detail"><span>Complaint context:</span> ${escapeHTML(item.context)}</div>`
                        : `<div class="context-detail">No matching sentence context was found.</div>`;
                    return `<div class="entity-context-item"><div>${meaning}: ${value}</div>${context}</div>`;
                }).join("");
            }

            function displayAmounts(amounts) {
                if (!Array.isArray(amounts) || amounts.length === 0) {
                    return "Not provided";
                }
                return amounts.map(formatAmount).join(", ");
            }



            /* =================================================
               BUILD FIELD LIST
            ================================================== */

            const fields = [

                [
                    "Crime Category",

                    incident.crime_category,

                    "crime_category"

                ],


                [
                    "Crime Type",

                    incident.crime_subcategory,

                    "crime_subcategory"

                ],


                [
                    "Channel",

                    incident.channels,

                    "channels"

                ],


                [
                    "Deception Method",

                    incident.deception,

                    "deception"

                ],


                [
                    "Victim Action",

                    incident.victim_action,

                    "victim_action"

                ],


                [
                    "Attacker Action",

                    incident.attacker_action,

                    "attacker_action"

                ],


                [
                    "Outcome",

                    incident.outcome,

                    "outcome"

                ],


                [
                    "Payment Method",

                    incident.payment_method,

                    "payment_method"

                ],


                [
                    "Amount",

                    incident.amounts,

                    "amounts"

                ],


                [
                    "Organizations",

                    incident.organizations,

                    "organizations"

                ],


                [
                    "Location",

                    hasValue(incident.location_mentions)
                        ? incident.location_mentions
                        : incident.locations,

                    "locations"

                ]

            ];

/* =================================================
               RENDER TABLE
            ================================================== */

            c.innerHTML += `

                <div class="card">

                    <div class="section-head">

                        <h3>
                            Extracted Incident Information
                        </h3>

                        <span>
                            NLP-generated representation
                        </span>

                    </div>


                    <div class="table-wrap">

                        <table class="data-table">

                            <thead>

                                <tr>

                                    <th>
                                        Field
                                    </th>

                                    <th>
                                        Extracted Information
                                    </th>

                                    <th>
                                        Status
                                    </th>

                                </tr>

                            </thead>


                            <tbody>

                                ${

                                    fields
                                        .map(
                                            field => {

                                                const label =
                                                    field[0];

                                                const rawValue =
                                                    field[1];

                                                const key =
                                                    field[2];


                                                const value =

                                                    key === "amounts"
                                                        ? displayContextualDetails(
                                                            incident.amount_details,
                                                            rawValue,
                                                            "amount"
                                                        )
                                                        : key === "locations"
                                                            ? displayContextualDetails(
                                                                incident.location_details,
                                                                hasValue(incident.location_mentions) ? incident.location_mentions : rawValue,
                                                                "location"
                                                            )
                                                            : displayValue(rawValue);


                                                return `

                                                    <tr>

                                                        <td>

                                                            <strong>
                                                                ${label}
                                                            </strong>

                                                        </td>


                                                        <td>

                                                            ${value}

                                                        </td>


                                                        <td>

                                                            ${statusFor(
                                                                rawValue,
                                                                key
                                                            )}

                                                        </td>

                                                    </tr>

                                                `;

                                            }
                                        )
                                        .join("")

                                }

                            </tbody>

                        </table>

                    </div>



                    <!-- =====================================
                         ENTITY DETAILS
                    ====================================== -->

                    <div
                        class="divider"
                        style="margin:22px 0"
                    ></div>


                    <div class="section-head">

                        <h3>
                            Extracted Indicators
                        </h3>

                        <span>
                            Additional information detected from the complaint
                        </span>

                    </div>


                    <div class="incident-grid">


                        ${

                            field(
                                "Phone Numbers",
                                displayContextualDetails(
                                    incident.phone_details,
                                    incident.phones,
                                    "phone"
                                ),
                                "phones",
                                false
                            )

                        }


                        ${

                            field(
                                "Email Addresses",
                                displayContextualDetails(
                                    incident.email_details,
                                    incident.emails,
                                    "email"
                                ),
                                "emails",
                                false
                            )

                        }


                        ${

                            field(
                                "UPI IDs",
                                displayContextualDetails(
                                    incident.upi_details,
                                    incident.upi_ids,
                                    "upi"
                                ),
                                "upi_ids",
                                false
                            )

                        }


                        ${

                            field(
                                "URLs",
                                displayContextualDetails(
                                    incident.url_details,
                                    incident.urls,
                                    "url"
                                ),
                                "urls",
                                false
                            )

                        }


                    </div>



                    <!-- =====================================
                         ACTIONS
                    ====================================== -->

                    <div
                        class="actions"
                        style="margin-top:22px"
                    >

                        <a
                            class="btn btn-primary"
                            href="missing-info.html"
                        >

                            Continue Review →

                        </a>


                        <a
                            class="btn btn-secondary"
                            href="complaint.html"
                        >

                            Back

                        </a>

                    </div>


                </div>

            `;

        }

    </script>

</body>

</html>
