<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Profile — LinkageX</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305070d'/%3E%3Ccircle cx='9' cy='10' r='2.6' fill='%2354d9ff'/%3E%3Ccircle cx='23' cy='9' r='2.2' fill='%2354d9ff'/%3E%3Ccircle cx='16' cy='22' r='2.6' fill='%23ffb454'/%3E%3Cpath d='M9 10 L23 9 M9 10 L16 22 M23 9 L16 22' stroke='%2354d9ff' stroke-width='1' opacity='.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/components.css">
<style>
:root{--void:#05070d;--panel:#0a0f18;--panel-2:#0d1420;--line:rgba(148,197,224,.14);--line-strong:rgba(148,197,224,.28);--ink:#e9f1f8;--ink-dim:#8fa0b6;--ink-faint:#5b6a80;--cyan:#54d9ff;--cyan-soft:rgba(84,217,255,.16);--amber:#ffb454;--red:#ff7a7a;--sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;--display:'Space Grotesk',var(--sans);--mono:'IBM Plex Mono',ui-monospace,monospace;--sidebar-w:248px;--topbar-h:64px}
*{box-sizing:border-box}html{-webkit-font-smoothing:antialiased}body{margin:0;background:var(--void);color:var(--ink);font-family:var(--sans);line-height:1.55}a{color:inherit;text-decoration:none}img,svg{display:block}button,input{font:inherit}h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0}p{margin:0}
.app-shell{position:relative;display:flex;min-height:100vh}.app-shell:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;opacity:.22;mask-image:radial-gradient(ellipse 90% 70% at 20% 0%,black,transparent 75%)}
.sidebar{position:fixed;inset:0 auto 0 0;z-index:40;width:var(--sidebar-w);height:100vh;overflow-y:auto;display:flex;flex-direction:column;flex:0 0 var(--sidebar-w);padding:22px 0 18px;background:var(--panel);border-right:1px solid var(--line);color:var(--ink)}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:0 22px 22px;margin-bottom:6px;border-bottom:1px solid var(--line)}.sidebar-brand svg{width:26px;height:26px;flex:0 0 auto}.sidebar-brand span{font-family:var(--display);font-weight:600;font-size:1rem}.sidebar-role{font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;color:var(--cyan);padding:16px 22px 10px;text-transform:uppercase}.sidebar-nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;flex:1}.sidebar-nav a{display:flex;align-items:center;gap:12px;padding:10px 22px;font-size:.9rem;color:var(--ink-dim);border-left:2px solid transparent;transition:color .18s,background .18s,border-color .18s}.sidebar-nav a svg{width:17px;height:17px;flex:0 0 auto;opacity:.85}.sidebar-nav a:hover{color:var(--ink);background:rgba(148,197,224,.05)}.sidebar-nav a.active{color:var(--cyan);background:var(--cyan-soft);border-left-color:var(--cyan)}.sidebar-foot{padding:14px 22px 0;margin-top:10px;border-top:1px solid var(--line)}.sidebar-foot a{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--ink-faint);padding-top:14px}.sidebar-foot a:hover{color:var(--red)}.sidebar-foot a svg{width:16px;height:16px}
.main-col{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-width:0;min-height:100vh;margin-left:var(--sidebar-w)}.topbar{height:var(--topbar-h);flex:0 0 var(--topbar-h);position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 30px;background:rgba(10,15,24,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.topbar-crumb{font-family:var(--mono);font-size:.76rem;color:var(--ink-faint);letter-spacing:.02em}.topbar-crumb b{color:var(--ink-dim);font-weight:500}.topbar-user{display:flex;align-items:center;gap:10px}.user-chip{width:30px;height:30px;border-radius:50%;background:var(--cyan-soft);border:1px solid var(--line-strong);color:var(--cyan);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:.85rem}.user-meta{display:flex;flex-direction:column;line-height:1.25}.user-meta b{font-size:.85rem;font-weight:500}.user-meta span{font-family:var(--mono);font-size:.68rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em}
.content{position:relative;z-index:1;padding:34px 34px 70px;max-width:1180px;width:100%;margin:0 auto}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:30px}.page-head h1{font-size:clamp(1.4rem,2.4vw,1.9rem);letter-spacing:-.01em;margin-bottom:8px}.page-head p{color:var(--ink-dim);font-size:.95rem;max-width:56ch}
.profile-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:20px;align-items:start}.card{position:relative;min-width:0;padding:24px;background:var(--panel-2);border:1px solid var(--line-strong)}.card:before,.card:after{content:"";position:absolute;width:14px;height:14px;pointer-events:none}.card:before{top:-1px;left:-1px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan)}.card:after{bottom:-1px;right:-1px;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan)}.card-title{font-family:var(--display);font-weight:600;font-size:1.02rem;margin:0 0 6px}.card-sub{font-size:.86rem;color:var(--ink-dim);margin:0 0 22px}.profile-form{display:grid;gap:18px}.profile-form label{display:grid;gap:8px;color:var(--ink-dim);font-size:.82rem;font-weight:500}.profile-form input{width:100%;min-width:0;padding:12px 13px;border:1px solid var(--line-strong);border-radius:0;background:#060910;color:var(--ink);font-family:var(--sans);font-size:.9rem;outline:none}.profile-form input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(84,217,255,.08)}.profile-form input::placeholder{color:var(--ink-faint)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border:0;cursor:pointer;font-family:var(--sans);font-weight:500;font-size:.87rem;transition:filter .2s,transform .2s,background .2s,border-color .2s}.btn-primary{background:var(--cyan);color:var(--void);clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}.btn-primary:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn-secondary{background:transparent;border:1px solid var(--line-strong);color:var(--ink)}.btn-secondary:hover{border-color:var(--cyan);background:var(--cyan-soft)}.profile-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}.alert{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border:1px solid var(--line-strong);font-size:.88rem;color:var(--ink-dim);line-height:1.75}.alert-info{border-left:3px solid var(--amber);background:rgba(255,180,84,.05)}.alert strong{display:block;color:var(--ink);margin-bottom:5px}.divider{height:1px;margin:22px 0;border:0;background:var(--line)}.note{font-size:.87rem;color:var(--ink-dim);line-height:1.8}.info-kicker{font-family:var(--mono);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--cyan);margin-bottom:12px}.toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}.toast{background:var(--panel-2);border:1px solid var(--cyan);color:var(--ink);padding:11px 18px;font-size:.86rem;font-family:var(--sans);box-shadow:0 8px 30px rgba(0,0,0,.4)}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:transform .25s}.sidebar.open{transform:translateX(0)}.main-col{margin-left:0}.content{padding:24px 18px 60px}.topbar{padding:0 18px}.profile-grid{grid-template-columns:1fr}}@media(max-width:640px){.content{padding:20px 14px 40px}.card{padding:18px}.topbar{gap:10px}.user-meta b{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
(function(){
  var storedAccount=null;
  try{storedAccount=JSON.parse(localStorage.getItem('linkageXCitizenAccount')||'null')}catch(err){}
  var citizenName=(storedAccount&&storedAccount.name)||sessionStorage.getItem('linkageXCitizenName')||'Citizen';
  var citizenInitial=(citizenName.trim().charAt(0)||'C').toUpperCase();
  window.LinkageXCitizen={account:storedAccount||{},name:citizenName,initial:citizenInitial};
})();
(function(){
  var ICONS={
    dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>',
    complaint:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg>',
    list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
    awareness:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M12 8v5M12 16.2h.01"/></svg>',
    guidance:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.5 2.5 0 014.9.8c0 1.7-2.4 2-2.4 3.6M12 17.2h.01"/></svg>',
    signout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>'
  };
  var NAV=[["dashboard","Dashboard","dashboard.html"],["complaint","Submit Complaint","complaint.html"],["list","My Complaints","complaints.html"],["awareness","Regional Awareness","awareness.html"],["guidance","Safety Center","guidance.html"]];
  var BRAND='<svg viewBox="0 0 30 30"><circle cx="8" cy="9" r="2.6" fill="#54d9ff"/><circle cx="22" cy="8" r="2.2" fill="#54d9ff"/><circle cx="15" cy="21" r="2.6" fill="#ffb454"/><path d="M8 9 L22 8 M8 9 L15 21 M22 8 L15 21" stroke="#54d9ff" stroke-width="1" opacity=".55"/></svg>';
  var navHtml=NAV.map(function(item){return '<li><a href="'+item[2]+'">'+ICONS[item[0]]+'<span>'+item[1]+'</span></a></li>'}).join('');
  document.body.innerHTML='<div class="app-shell"><aside class="sidebar"><div class="sidebar-brand">'+BRAND+'<span>LinkageX</span></div><div class="sidebar-role">Citizen Portal</div><ul class="sidebar-nav">'+navHtml+'</ul><div class="sidebar-foot"><a href="#" id="signOutLink">'+ICONS.signout+'<span>Sign out</span></a></div></aside><div class="main-col"><header class="topbar"><div class="topbar-crumb">LinkageX / <b>Profile</b></div><a class="topbar-user" href="profile.html" aria-label="Open profile"><div class="user-meta"><b>'+String(LinkageXCitizen.name).replace(/[&<>"']/g,'')+'</b><span>citizen</span></div><div class="user-chip">'+LinkageXCitizen.initial+'</div></a></header><main class="content" id="pageContent"></main></div></div><div id="toast-root" class="toast-root"></div>';
  document.getElementById('signOutLink').addEventListener('click',function(e){e.preventDefault();toast('Signed out (prototype only).')});
  var c=document.getElementById('pageContent');
  c.innerHTML='<div class="page-head"><div><h1>My Profile</h1><p>Manage the basic profile information used to personalize your experience.</p></div></div><div class="profile-grid"><section class="card"><h2 class="card-title">Profile information</h2><p class="card-sub">Update the details associated with your citizen profile.</p><form class="profile-form" id="profileForm"><label for="profileName">Name<input id="profileName" name="name" value="'+String(LinkageXCitizen.name).replace(/[&<>"']/g,'')+'" autocomplete="name"></label><label for="profileAge">Age / Age group<input id="profileAge" name="age" value="20 / 18–24"></label><label for="profileCity">City / Region<input id="profileCity" name="city" value="Mumbai" autocomplete="address-level2"></label><label for="profileContact">Optional contact information<input id="profileContact" name="contact" placeholder="Not provided" autocomplete="email"></label><div class="profile-actions"><button class="btn btn-primary" type="submit">Save Profile</button></div></form></section><section class="card"><div class="info-kicker">Important information</div><div class="alert alert-info"><div><strong>Profile vs victim information</strong>Profile information is used to personalize your experience. It is separate from information about the victim in a complaint.</div></div><hr class="divider"><p class="note">A citizen may submit a complaint on behalf of someone else. The complaint flow therefore collects victim context separately.</p></section></div>';
  document.getElementById('profileForm').addEventListener('submit',function(e){
    e.preventDefault();
    var account={name:document.getElementById('profileName').value.trim(),age:document.getElementById('profileAge').value.trim(),city:document.getElementById('profileCity').value.trim(),contact:document.getElementById('profileContact').value.trim()};
    if(!account.name){toast('Please enter your name.');return}
    try{localStorage.setItem('linkageXCitizenAccount',JSON.stringify(account));sessionStorage.setItem('linkageXCitizenName',account.name)}catch(err){}
    toast('Profile changes saved locally for this demo.');
  });
})();
</script>
</body>
</html>
